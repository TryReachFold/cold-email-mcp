[project]
license = "Apache-2.0"
name = "cold-email-mcp"
description = "CLI for the Reachfold free outbound tools: email verifier, DNS deliverability audit, spam score, email permutations and an outbound ROI calculator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = [
  "cli",
  "cold-email",
  "deliverability",
  "dkim",
  "dmarc",
  "dns",
  "email",
  "outbound",
  "spam",
  "spf",
  "verify",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.scripts]
cold-email-mcp = "cold_email_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cold_email_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cold_email_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cold_email_mcp",
  "tests",
  "README.md",
  "pyproject.toml",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "S",   # flake8-bandit (security)
]
ignore = [
  "S101", # assert allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S311", "S603"]
# The client only opens URLs that normalize_base_url validated (https, or http on localhost).
"src/cold_email_mcp/http.py" = ["S310"]
